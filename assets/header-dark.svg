           stroke-dasharray:.14 1.2; stroke-dashoffset:.14; opacity:0;
           animation: travel 3.2s linear infinite }
  .node { fill:#14213D; stroke:#F4EDE0; stroke-width:2 }
  .fire { fill:#FF6B5B; opacity:0; animation: fire 3.2s ease-out infinite }
  .eyebrow { font:600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing:2.5px; fill:#FF6B5B }
