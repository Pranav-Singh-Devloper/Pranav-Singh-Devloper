  .chip { fill:none; stroke:#F4EDE0; stroke-opacity:.25 }
  .chipt { font:500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill:#F4EDE0; opacity:.8 }
  .io { font:500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill:#A9B1C4 }
  .caret { fill:#FF6B5B; animation: blink 1.1s steps(1) infinite }
  @keyframes travel { 0% { stroke-dashoffset:.14; opacity:1 } 22% { stroke-dashoffset:-1; opacity:1 } 23%,100% { opacity:0 } }
  @keyframes fire { 0% { opacity:0 } 6% { opacity:.95 } 30%,100% { opacity:0 } }
  @keyframes blink { 50% { opacity:0 } }
  @media (prefers-reduced-motion: reduce) { .pulse, .fire, .caret { animation:none } }
</style>
